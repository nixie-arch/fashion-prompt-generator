<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아동 패션 프롬프트 생성기</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .fade-in  { animation: fadeIn  0.22s ease-out; }
    .slide-in { animation: slideIn 0.22s ease-out; }
    @keyframes fadeIn  { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideIn { from { opacity:0; } to { opacity:1; } }
    pre { white-space:pre-wrap; word-break:break-word; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useRef, useEffect } = React;

/* ── CONSTANTS ──────────────────────────────────────────────────────────── */
const POSE_OPTIONS = [
  { value:'front',       label:'정면',        en:'front-facing, looking at camera' },
  { value:'45degree',    label:'45도 측면',   en:'45-degree angle, slight side profile' },
  { value:'handPocket',  label:'손 주머니',   en:'standing casually with both hands in pockets' },
  { value:'lookingBack', label:'뒤돌아보기',  en:'turned away, looking back over the shoulder' },
  { value:'custom',      label:'커스텀',      en:null },
];
const EXPRESSION_OPTIONS = [
  { value:'neutral', label:'무표정', en:'calm neutral expression, relaxed' },
  { value:'smile',   label:'미소',   en:'gentle natural smile' },
  { value:'playful', label:'발랄한', en:'bright playful and cheerful expression' },
  { value:'shy',     label:'수줍은', en:'soft shy expression, slight smile' },
  { value:'custom',  label:'커스텀', en:null },
];
const COMPOSITION_OPTIONS = [
  { value:'fullBody',  label:'전신',     en:'full body shot, head to toe' },
  { value:'upperBody', label:'상반신',   en:'upper body shot, waist up' },
  { value:'aboveKnee', label:'무릎 위',  en:'three-quarter shot, above the knee' },
  { value:'closeup',   label:'클로즈업', en:'close-up shot, chest and face' },
  { value:'custom',    label:'커스텀',   en:null },
];
const BACKGROUND_OPTIONS = [
  { value:'studioWhite',   label:'스튜디오 화이트',   en:'clean pure white studio background, seamless' },
  { value:'horizonStudio', label:'호라이즌 스튜디오', en:'seamless horizon studio backdrop in soft light gray' },
  { value:'outdoorNature', label:'아웃도어 자연',     en:'soft outdoor setting with natural greenery and warm light' },
  { value:'custom',        label:'커스텀',            en:null },
];
const BODY_TYPE_OPTIONS = [
  { value:'slim',   label:'슬림', en:'slim build' },
  { value:'normal', label:'보통', en:'average build' },
  { value:'chubby', label:'통통', en:'slightly chubby build' },
];

const getLabelKo = (opts, val) => opts.find(o=>o.value===val)?.label ?? '';
const getEnStr   = (opts, val) => opts.find(o=>o.value===val)?.en   ?? '';
const LS_KEY = 'fashionModels_v1';

/* ── UTILITIES ──────────────────────────────────────────────────────────── */
const uid = () => Math.random().toString(36).slice(2,9);

const toBase64 = file => new Promise((res,rej)=>{
  const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file);
});

const compressImage = (base64, maxSize=600, quality=0.78) => new Promise(resolve=>{
  const img=new Image();
  img.onload=()=>{
    let w=img.width, h=img.height;
    if(w>maxSize||h>maxSize){ if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}else{w=Math.round(w*maxSize/h);h=maxSize;} }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    resolve(c.toDataURL('image/jpeg',quality));
  };
  img.src=base64;
});

/* Convert base64 to PNG blob for clipboard API */
const toPngBlob = (base64) => new Promise(resolve=>{
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    c.getContext('2d').drawImage(img,0,0);
    c.toBlob(resolve,'image/png');
  };
  img.src=base64;
});

/* Copy a single image to clipboard */
const copyImgToClipboard = async (base64) => {
  try {
    const blob = await toPngBlob(base64);
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    return true;
  } catch(e) {
    return false;
  }
};

/* Download a single image as file */
const downloadImg = (base64, filename) => {
  toPngBlob(base64).then(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
};

/* Download all images sequentially */
const downloadAllImgs = (imageGroups) => {
  const all=[];
  imageGroups.forEach(({images,prefix})=>{
    images.forEach((src,i)=>all.push({src,name:`${prefix}_${i+1}.png`}));
  });
  all.forEach(({src,name},i)=>setTimeout(()=>downloadImg(src,name), i*350));
};

const newClothingItem = () => ({id:uid(),images:[],material:'',color:'',fit:'',neckline:'',graphic:''});
const newModelData    = () => ({name:'',images:[],gender:'female',age:8,bodyType:'normal'});

const newSet = (n=1) => ({
  id:uid(), label:`세트 ${n}`,
  open:{model:true,pose:false,expression:false,composition:false,background:false,clothing:false,style:false},
  modelSource:'direct', selectedModelId:null,
  modelImages:[], gender:'female', age:8, bodyType:'normal',
  pose:'front', poseCustom:'',
  expression:'neutral', expressionCustom:'',
  composition:'fullBody', compositionCustom:'',
  background:'studioWhite', bgImage:null, bgCustom:'',
  clothingItems:[newClothingItem()],
  styleImages:[], styleMemo:'',
});

/* ── PROMPT BUILDER ─────────────────────────────────────────────────────── */
const buildPrompt = (set) => {
  const gender      = set.gender==='female'?'girl':'boy';
  const bodyType    = getEnStr(BODY_TYPE_OPTIONS,set.bodyType);
  const pose        = set.pose==='custom'?set.poseCustom:getEnStr(POSE_OPTIONS,set.pose);
  const expression  = set.expression==='custom'?set.expressionCustom:getEnStr(EXPRESSION_OPTIONS,set.expression);
  const composition = set.composition==='custom'?set.compositionCustom:getEnStr(COMPOSITION_OPTIONS,set.composition);
  const background  = set.background==='custom'?set.bgCustom:getEnStr(BACKGROUND_OPTIONS,set.background);

  const refs=[];
  if(set.modelImages.length) refs.push(`${set.modelImages.length} model reference photo(s)`);
  const ci=set.clothingItems.reduce((a,c)=>a+c.images.length,0);
  if(ci) refs.push(`${ci} clothing reference photo(s)`);
  if(set.bgImage) refs.push('1 background reference photo');
  if(set.styleImages.length) refs.push(`${set.styleImages.length} style reference photo(s)`);
  const refLine=refs.length?`Reference images attached: ${refs.join(', ')}\n\n`:'';

  const clothingLines=set.clothingItems.map((c,i)=>{
    const d=[];
    if(c.color) d.push(c.color); if(c.material) d.push(`${c.material} fabric`);
    if(c.fit) d.push(`${c.fit} fit`); if(c.neckline) d.push(`${c.neckline} neckline`);
    if(c.graphic) d.push(`with ${c.graphic}`);
    return `  • Item ${i+1}: ${d.length?d.join(', '):'(see reference image)'}`;
  }).join('\n');

  const styleLine=set.styleMemo?`\nStyle notes: ${set.styleMemo}`:'';
  const safeMode=set.gender==='female'?'\n\n[GPT Image2 safe mode template applied]':'';

  return `${refLine}Generate a realistic fashion catalog photograph of a young Korean ${gender}, age ${set.age}, with a ${bodyType}.

Clothing worn:
${clothingLines}

Pose: ${pose}
Expression: ${expression}
Composition: ${composition}
Background: ${background}${styleLine}

Quality: high resolution, natural studio lighting, photorealistic, clean and minimal catalog style, age-appropriate and child-safe content.${safeMode}`;
};

/* ── CSV BUILDER ────────────────────────────────────────────────────────── */
const buildCSV = (history) => {
  const headers=['생성시간','세트명','성별','나이','체형','포즈','표정','구도','배경','의류설명','생성프롬프트'];
  const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
  const rows=history.map(h=>{
    const m=h.meta;
    const cs=m.clothingItems.map((c,i)=>`[의류${i+1}] ${[c.color,c.material,c.fit].filter(Boolean).join('/')}`).join(' | ');
    return [
      h.timestamp,m.label,m.gender==='female'?'여아':'남아',m.age,
      getLabelKo(BODY_TYPE_OPTIONS,m.bodyType),
      m.pose==='custom'?m.poseCustom:getLabelKo(POSE_OPTIONS,m.pose),
      m.expression==='custom'?m.expressionCustom:getLabelKo(EXPRESSION_OPTIONS,m.expression),
      m.composition==='custom'?m.compositionCustom:getLabelKo(COMPOSITION_OPTIONS,m.composition),
      m.background==='custom'?m.bgCustom:getLabelKo(BACKGROUND_OPTIONS,m.background),
      cs,h.prompt,
    ].map(esc).join(',');
  });
  return [headers.join(','),...rows].join('\r\n');
};

/* ── BASE COMPONENTS ────────────────────────────────────────────────────── */
function Accordion({title,isOpen,onToggle,children}){
  return(
    <div className="border border-gray-200 rounded-xl mb-3 overflow-hidden">
      <button type="button" onClick={onToggle}
        className="w-full flex items-center justify-between px-5 py-3.5 bg-white hover:bg-gray-50 transition-colors text-left focus:outline-none">
        <span className="text-sm font-semibold text-gray-700">{title}</span>
        <svg className={`w-4 h-4 text-gray-400 transition-transform duration-200 ${isOpen?'rotate-180':''}`}
          fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      {isOpen&&<div className="px-5 pb-5 pt-3 bg-white border-t border-gray-100 slide-in">{children}</div>}
    </div>
  );
}

function PillRadio({options,value,onChange,name}){
  return(
    <div className="flex flex-wrap gap-2">
      {options.map(opt=>(
        <label key={opt.value} className={`cursor-pointer select-none px-4 py-2 rounded-full border text-sm font-medium transition-all ${
          value===opt.value?'bg-blue-600 text-white border-blue-600 shadow-sm':'bg-white text-gray-600 border-gray-200 hover:border-blue-300 hover:text-blue-600'}`}>
          <input type="radio" name={name} value={opt.value} checked={value===opt.value} onChange={()=>onChange(opt.value)} className="sr-only"/>
          {opt.label}
        </label>
      ))}
    </div>
  );
}

function CustomInput({placeholder,value,onChange}){
  return(
    <input type="text" placeholder={placeholder} value={value} onChange={e=>onChange(e.target.value)}
      className="mt-3 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent"/>
  );
}

function ImgUploader({images,onAdd,onRemove,maxN,label,compress=false}){
  const ref=useRef(null);
  const handle=async(files)=>{
    const slots=maxN-images.length; if(slots<=0)return;
    const b64s=await Promise.all([...files].slice(0,slots).map(toBase64));
    const final=compress?await Promise.all(b64s.map(b=>compressImage(b))):b64s;
    onAdd(final);
  };
  return(
    <div>
      <div onDrop={e=>{e.preventDefault();handle(e.dataTransfer.files);}} onDragOver={e=>e.preventDefault()}
        onClick={()=>images.length<maxN&&ref.current?.click()}
        className={`border-2 border-dashed rounded-xl p-4 text-center transition-all ${
          images.length>=maxN?'border-gray-200 bg-gray-50 cursor-not-allowed opacity-60':'border-blue-200 bg-blue-50 cursor-pointer hover:border-blue-400 hover:bg-blue-100'}`}>
        <svg className="w-6 h-6 mx-auto mb-1 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5"
            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <p className="text-xs text-gray-500">
          {images.length>=maxN?`최대 ${maxN}장 완료`:`${label} (${images.length}/${maxN}) — 클릭 또는 드래그`}
        </p>
        <input ref={ref} type="file" accept="image/*" multiple className="hidden" onChange={e=>handle(e.target.files)}/>
      </div>
      {images.length>0&&(
        <div className="flex flex-wrap gap-2 mt-2">
          {images.map((src,i)=>(
            <div key={i} className="relative group">
              <img src={src} alt="" className="w-20 h-20 object-cover rounded-lg border border-gray-200 shadow-sm"/>
              <button type="button" onClick={()=>onRemove(i)}
                className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center shadow opacity-0 group-hover:opacity-100 transition-opacity">×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── IMAGE THUMBNAIL (in result card) ──────────────────────────────────── */
function ImageThumb({ src, filename }) {
  const [state, setState] = useState('idle'); // idle | copying | copied | failed

  const handleCopy = async (e) => {
    e.stopPropagation();
    setState('copying');
    const ok = await copyImgToClipboard(src);
    setState(ok ? 'copied' : 'failed');
    setTimeout(() => setState('idle'), 1800);
  };

  const handleDownload = (e) => {
    e.stopPropagation();
    downloadImg(src, filename);
  };

  const overlayLabel = { idle:'', copying:'복사 중', copied:'복사됨!', failed:'복사 실패\n(다운로드로 저장)' }[state];

  return (
    <div className="relative group w-20 h-20 shrink-0">
      <img src={src} alt={filename} className="w-20 h-20 object-cover rounded-xl border border-gray-200 shadow-sm"/>
      {/* hover overlay */}
      <div className={`absolute inset-0 rounded-xl transition-all flex flex-col items-center justify-center gap-1.5 ${
        state!=='idle' ? 'bg-black/60' : 'bg-black/0 group-hover:bg-black/50'
      } opacity-0 group-hover:opacity-100 ${state!=='idle'?'opacity-100':''}`}>
        {state === 'idle' ? (
          <>
            <button onClick={handleCopy} title="클립보드에 복사"
              className="w-7 h-7 bg-white/90 hover:bg-blue-500 hover:text-white text-gray-700 rounded-full flex items-center justify-center transition-all shadow">
              <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
            </button>
            <button onClick={handleDownload} title="다운로드"
              className="w-7 h-7 bg-white/90 hover:bg-emerald-500 hover:text-white text-gray-700 rounded-full flex items-center justify-center transition-all shadow">
              <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
              </svg>
            </button>
          </>
        ) : (
          <p className={`text-center text-xs font-semibold px-1 leading-tight ${
            state==='copied'?'text-green-300':state==='failed'?'text-red-300':'text-white'
          }`}>{overlayLabel}</p>
        )}
      </div>
    </div>
  );
}

function ImagePanel({ images }) {
  const groups = [
    { key:'model',      label:'모델 이미지',          prefix:'model',      list: images.model },
    { key:'clothing',   label:'의류 이미지',           prefix:'clothing',   list: images.clothing },
    { key:'background', label:'배경 레퍼런스',         prefix:'background', list: images.background?[images.background]:[] },
    { key:'style',      label:'스타일 레퍼런스',       prefix:'style_ref',  list: images.style },
  ].filter(g => g.list.length > 0);

  if (groups.length === 0) return null;

  const handleDownloadAll = () => {
    downloadAllImgs(groups.map(g=>({images:g.list, prefix:g.prefix})));
  };

  return (
    <div className="mb-4 border border-blue-200 bg-blue-50 rounded-xl p-4">
      <div className="flex items-center justify-between mb-3">
        <div>
          <p className="text-sm font-semibold text-blue-800">첨부 이미지</p>
          <p className="text-xs text-blue-600 mt-0.5">이미지 위에 마우스를 올리면 복사/다운로드 버튼이 나타납니다</p>
        </div>
        <button onClick={handleDownloadAll}
          className="flex items-center gap-1.5 px-3 py-1.5 bg-white text-emerald-700 border border-emerald-200 rounded-lg text-xs font-semibold hover:bg-emerald-50 transition-colors shadow-sm shrink-0">
          <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
            <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          전체 다운로드
        </button>
      </div>

      <div className="space-y-3">
        {groups.map(g=>(
          <div key={g.key}>
            <p className="text-xs font-medium text-blue-700 mb-1.5">{g.label}</p>
            <div className="flex flex-wrap gap-2">
              {g.list.map((src,i)=>(
                <ImageThumb key={i} src={src} filename={`${g.prefix}_${i+1}.png`}/>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div className="mt-3 pt-3 border-t border-blue-200">
        <p className="text-xs text-blue-700 leading-relaxed">
          <strong>AI 이미지 생성 도구 사용법:</strong>{' '}
          ① 프롬프트 복사 후 붙여넣기 → ② 이미지를 한 장씩 클립보드 복사(클릭) → ③ AI 도구에 Ctrl+V로 붙여넣기
          <br/>
          <span className="text-blue-500">※ 브라우저 보안 정책상 여러 이미지를 한 번에 복사하는 것은 지원되지 않습니다. 이미지가 복사되지 않으면 다운로드 후 직접 첨부하세요.</span>
        </p>
      </div>
    </div>
  );
}

/* ── MODEL LIBRARY COMPONENTS ───────────────────────────────────────────── */
function ModelForm({initial,onSave,onCancel}){
  const [form,setForm]=useState(initial?{name:initial.name,images:initial.images,gender:initial.gender,age:initial.age,bodyType:initial.bodyType}:newModelData());
  const valid=form.name.trim().length>0;
  return(
    <div className="space-y-4">
      <div>
        <label className="block text-xs font-medium text-gray-600 mb-1.5">모델 이름 *</label>
        <input type="text" placeholder="예: 지민 (7세 여아)" value={form.name}
          onChange={e=>setForm(f=>({...f,name:e.target.value}))}
          className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
      </div>
      <ImgUploader images={form.images}
        onAdd={imgs=>setForm(f=>({...f,images:[...f.images,...imgs].slice(0,3)}))}
        onRemove={i=>setForm(f=>({...f,images:f.images.filter((_,j)=>j!==i)}))}
        maxN={3} label="모델 사진" compress={true}/>
      <div className="grid grid-cols-3 gap-3">
        <div>
          <label className="block text-xs font-medium text-gray-600 mb-1.5">성별</label>
          <select value={form.gender} onChange={e=>setForm(f=>({...f,gender:e.target.value}))}
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
            <option value="female">여아</option><option value="male">남아</option>
          </select>
        </div>
        <div>
          <label className="block text-xs font-medium text-gray-600 mb-1.5">나이</label>
          <input type="number" min="4" max="15" value={form.age}
            onChange={e=>setForm(f=>({...f,age:Math.max(4,Math.min(15,+e.target.value||4))}))}
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"/>
        </div>
        <div>
          <label className="block text-xs font-medium text-gray-600 mb-1.5">체형</label>
          <select value={form.bodyType} onChange={e=>setForm(f=>({...f,bodyType:e.target.value}))}
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
            {BODY_TYPE_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      </div>
      <div className="flex gap-2 justify-end pt-2 border-t border-gray-100">
        <button type="button" onClick={onCancel}
          className="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">취소</button>
        <button type="button" onClick={()=>valid&&onSave(form)} disabled={!valid}
          className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${valid?'bg-blue-600 text-white hover:bg-blue-700 shadow-sm':'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
          {initial?'저장':'모델 추가'}
        </button>

/* ── PROMPT RESULT ──────────────────────────────────────────────────────── */
function PromptResult({item}){
  const [copied,setCopied]=useState(false);

  const copyText=()=>{
    const text=item.prompt;
    if(navigator.clipboard?.writeText){
      navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);}).catch(()=>fb(text));
    } else { fb(text); }
  };
  const fb=(text)=>{
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{document.execCommand('copy');}catch{}
    document.body.removeChild(ta);
    setCopied(true); setTimeout(()=>setCopied(false),2000);
  };

  const m=item.meta;
  return(
    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4 fade-in">
      {/* Header */}
      <div className="flex items-start justify-between gap-3 flex-wrap mb-4">
        <div>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-bold text-gray-800">{m.label}</span>
            <span className="text-xs text-gray-400">{item.timestamp}</span>
          </div>
          <div className="flex flex-wrap gap-1.5 mt-2">
            <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">{m.gender==='female'?'여아':'남아'} {m.age}세</span>
            <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">{getLabelKo(BODY_TYPE_OPTIONS,m.bodyType)}</span>
            <span className="text-xs bg-violet-100 text-violet-700 px-2 py-0.5 rounded-full">{m.pose==='custom'?m.poseCustom:getLabelKo(POSE_OPTIONS,m.pose)}</span>
            <span className="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">{m.composition==='custom'?m.compositionCustom:getLabelKo(COMPOSITION_OPTIONS,m.composition)}</span>
          </div>
        </div>
        <button onClick={copyText}
          className={`shrink-0 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${copied?'bg-green-100 text-green-700 border border-green-200':'bg-blue-600 text-white hover:bg-blue-700 shadow-sm'}`}>
          {copied?'✓ 복사됨':'프롬프트 복사'}
        </button>
      </div>

      {/* Image Panel */}
      <ImagePanel images={item.images}/>

      {/* Prompt Text */}
      <pre className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm text-slate-700 font-mono leading-6 overflow-x-auto">{item.prompt}</pre>
    </div>
  );
}

/* ── HISTORY ────────────────────────────────────────────────────────────── */
function HistorySection({history,onClear}){
  if(!history.length) return null;
  const download=()=>{
    const csv=buildCSV(history);
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url;
    a.download=`fashion_prompts_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  };
  return(
    <section id="history-section" className="mt-10">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <h2 className="text-base font-bold text-gray-800">생성 히스토리 <span className="text-sm font-normal text-gray-400">{history.length}개</span></h2>
        <div className="flex gap-2">
          <button onClick={download}
            className="flex items-center gap-1.5 px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition-colors shadow-sm">
            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            CSV 다운로드
          </button>
          <button onClick={onClear}
            className="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">초기화</button>
        </div>
      </div>
      {[...history].reverse().map(item=><PromptResult key={item.id} item={item}/>)}
    </section>
  );
}

/* ── APP ────────────────────────────────────────────────────────────────── */
function App(){
  const [sets,setSets]=useState([newSet(1)]);
  const [history,setHistory]=useState([]);
  const [showLibrary,setShowLibrary]=useState(false);
  const [savedModels,setSavedModels]=useState(()=>{
    try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch{return [];}
  });

  useEffect(()=>{
    try{localStorage.setItem(LS_KEY,JSON.stringify(savedModels));}
    catch(e){console.warn('localStorage 저장 실패:',e);}
  },[savedModels]);

  const addModel=(m)=>setSavedModels(prev=>[...prev,m]);
  const updateModel=(id,data)=>setSavedModels(prev=>prev.map(m=>m.id===id?{...m,...data}:m));
  const deleteModel=(id)=>{
    setSavedModels(prev=>prev.filter(m=>m.id!==id));
    setSets(prev=>prev.map(s=>s.selectedModelId===id?{...s,selectedModelId:null,modelSource:'direct',modelImages:[]}:s));
  };

  const upSet=useCallback((id,fn)=>setSets(prev=>prev.map(s=>s.id===id?fn(s):s)),[]);
  const addSet=()=>setSets(prev=>[...prev,newSet(prev.length+1)]);
  const removeSet=(id)=>setSets(prev=>prev.filter(s=>s.id!==id));

  const generate=()=>{
    const now=new Date();
    const ts=`${now.toLocaleDateString('ko-KR')} ${now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}`;
    const items=sets.map(set=>({
      id:uid(), timestamp:ts,
      meta:{
        ...set, modelImages:[], bgImage:null, styleImages:[],
        clothingItems:set.clothingItems.map(c=>({...c,images:[]})),
      },
      /* Store actual images for display in result card */
      images:{
        model: set.modelImages,
        clothing: set.clothingItems.flatMap(c=>c.images),
        background: set.bgImage,
        style: set.styleImages,
      },
      prompt:buildPrompt(set),
    }));
    setHistory(prev=>[...prev,...items]);
    setTimeout(()=>document.getElementById('history-section')?.scrollIntoView({behavior:'smooth'}),150);
  };

  return(
    <div className="min-h-screen bg-slate-50">
      <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-20">
        <div className="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
          <div>
            <h1 className="text-lg font-bold text-gray-900">아동 패션 프롬프트 생성기</h1>
            <p className="text-xs text-gray-400 mt-0.5">AI 이미지 생성 도구용 프롬프트 자동 생성</p>
          </div>
          <button type="button" onClick={()=>setShowLibrary(true)}
            className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 transition-colors shadow-sm shrink-0">
            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            모델 라이브러리
            {savedModels.length>0&&(
              <span className="bg-white text-indigo-600 text-xs font-bold px-1.5 py-0.5 rounded-full leading-none">{savedModels.length}</span>
            )}
          </button>
        </div>
      </header>

      {showLibrary&&(
        <ModelLibraryModal onClose={()=>setShowLibrary(false)} savedModels={savedModels}
          onAdd={addModel} onUpdate={updateModel} onDelete={deleteModel}/>
      )}

      <main className="max-w-3xl mx-auto px-4 py-6">
        <div className="flex items-start gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mb-6">
          <svg className="w-4 h-4 mt-0.5 shrink-0 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p className="text-sm text-amber-800">
            생성된 프롬프트는 <strong>GPT-Image, Midjourney</strong> 등 외부 AI 이미지 생성 도구에서 사용하세요. 이미지는 브라우저 내에서만 처리됩니다.
          </p>
        </div>

        {sets.map((set,i)=>(
          <SetCard key={set.id} set={set} index={i} up={fn=>upSet(set.id,fn)}
            onRemove={()=>removeSet(set.id)} canRemove={sets.length>1} savedModels={savedModels}/>
        ))}

        <button type="button" onClick={addSet}
          className="w-full mb-5 border-2 border-dashed border-blue-200 rounded-2xl py-4 text-blue-500 font-medium text-sm hover:border-blue-400 hover:bg-blue-50 transition-all flex items-center justify-center gap-2">
          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
          세트 추가 (배치 모드)
        </button>

        <button type="button" onClick={generate}
          className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-2xl text-base shadow-lg hover:shadow-xl transition-all active:scale-[0.99]">
          프롬프트 생성
          {sets.length>1&&<span className="ml-2 text-blue-200 font-normal text-sm">({sets.length}개 세트)</span>}
        </button>

        <div id="history-section">
          <HistorySection history={history} onClear={()=>setHistory([])}/>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
