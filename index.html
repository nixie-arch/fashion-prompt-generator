<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아동 패션 프롬프트 생성기</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif; }
    .fade-in  { animation: fadeIn  0.22s ease-out; }
    .slide-in { animation: slideIn 0.22s ease-out; }
    @keyframes fadeIn  { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; }                              to { opacity: 1; }                          }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef } = React;

    /* ─── CONSTANTS ─────────────────────────────────────────────────────────── */

    const POSE_OPTIONS = [
      { value: 'front',       label: '정면',        en: 'front-facing, looking at camera' },
      { value: '45degree',    label: '45도 측면',   en: '45-degree angle, slight side profile' },
      { value: 'handPocket',  label: '손 주머니',   en: 'standing casually with both hands in pockets' },
      { value: 'lookingBack', label: '뒤돌아보기',  en: 'turned away, looking back over the shoulder' },
      { value: 'custom',      label: '커스텀',      en: null },
    ];

    const EXPRESSION_OPTIONS = [
      { value: 'neutral',  label: '무표정', en: 'calm neutral expression, relaxed' },
      { value: 'smile',    label: '미소',   en: 'gentle natural smile' },
      { value: 'playful',  label: '발랄한', en: 'bright playful and cheerful expression' },
      { value: 'shy',      label: '수줍은', en: 'soft shy expression, slight smile' },
      { value: 'custom',   label: '커스텀', en: null },
    ];

    const COMPOSITION_OPTIONS = [
      { value: 'fullBody',   label: '전신',     en: 'full body shot, head to toe' },
      { value: 'upperBody',  label: '상반신',   en: 'upper body shot, waist up' },
      { value: 'aboveKnee',  label: '무릎 위',  en: 'three-quarter shot, above the knee' },
      { value: 'closeup',    label: '클로즈업', en: 'close-up shot, chest and face' },
      { value: 'custom',     label: '커스텀',   en: null },
    ];

    const BACKGROUND_OPTIONS = [
      { value: 'studioWhite',   label: '스튜디오 화이트',   en: 'clean pure white studio background, seamless' },
      { value: 'horizonStudio', label: '호라이즌 스튜디오', en: 'seamless horizon studio backdrop in soft light gray' },
      { value: 'outdoorNature', label: '아웃도어 자연',     en: 'soft outdoor setting with natural greenery and warm light' },
      { value: 'custom',        label: '커스텀',            en: null },
    ];

    const BODY_TYPE_OPTIONS = [
      { value: 'slim',   label: '슬림', en: 'slim build' },
      { value: 'normal', label: '보통', en: 'average build' },
      { value: 'chubby', label: '통통', en: 'slightly chubby build' },
    ];

    const getLabelKo = (opts, val) => opts.find(o => o.value === val)?.label ?? '';
    const getEnStr   = (opts, val) => opts.find(o => o.value === val)?.en   ?? '';

    /* ─── UTILITIES ──────────────────────────────────────────────────────────── */

    const uid = () => Math.random().toString(36).slice(2, 9);

    const toBase64 = (file) => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });

    const newClothingItem = () => ({
      id: uid(), images: [],
      material: '', color: '', fit: '', neckline: '', graphic: '',
    });

    const newSet = (n = 1) => ({
      id: uid(),
      label: `세트 ${n}`,
      open: { model: true, pose: false, expression: false, composition: false, background: false, clothing: false, style: false },
      modelImages: [],
      gender: 'female', age: 8, bodyType: 'normal',
      pose: 'front', poseCustom: '',
      expression: 'neutral', expressionCustom: '',
      composition: 'fullBody', compositionCustom: '',
      background: 'studioWhite', bgImage: null, bgCustom: '',
      clothingItems: [newClothingItem()],
      styleImages: [], styleMemo: '',
    });

    /* ─── PROMPT BUILDER ──────────────────────────────────────────────────────── */

    const buildPrompt = (set) => {
      const gender     = set.gender === 'female' ? 'girl' : 'boy';
      const bodyType   = getEnStr(BODY_TYPE_OPTIONS, set.bodyType);
      const pose       = set.pose       === 'custom' ? set.poseCustom       : getEnStr(POSE_OPTIONS,        set.pose);
      const expression = set.expression === 'custom' ? set.expressionCustom : getEnStr(EXPRESSION_OPTIONS,  set.expression);
      const composition= set.composition=== 'custom' ? set.compositionCustom: getEnStr(COMPOSITION_OPTIONS, set.composition);
      const background = set.background === 'custom' ? set.bgCustom         : getEnStr(BACKGROUND_OPTIONS,  set.background);

      const refParts = [];
      if (set.modelImages.length)
        refParts.push(`${set.modelImages.length} model reference photo(s)`);
      const totalCImgs = set.clothingItems.reduce((a, c) => a + c.images.length, 0);
      if (totalCImgs)
        refParts.push(`${totalCImgs} clothing reference photo(s)`);
      if (set.bgImage)
        refParts.push('1 background reference photo');
      if (set.styleImages.length)
        refParts.push(`${set.styleImages.length} style reference photo(s)`);
      const refLine = refParts.length ? `Reference images attached: ${refParts.join(', ')}\n\n` : '';

      const clothingLines = set.clothingItems.map((c, i) => {
        const d = [];
        if (c.color)    d.push(c.color);
        if (c.material) d.push(`${c.material} fabric`);
        if (c.fit)      d.push(`${c.fit} fit`);
        if (c.neckline) d.push(`${c.neckline} neckline`);
        if (c.graphic)  d.push(`with ${c.graphic}`);
        return `  • Item ${i + 1}: ${d.length ? d.join(', ') : '(see reference image)'}`;
      }).join('\n');

      const styleLine = set.styleMemo ? `\nStyle notes: ${set.styleMemo}` : '';
      const safeMode  = set.gender === 'female'
        ? '\n\n[GPT Image2 safe mode template applied]'
        : '';

      return (
`${refLine}Generate a realistic fashion catalog photograph of a young Korean ${gender}, age ${set.age}, with a ${bodyType}.

Clothing worn:
${clothingLines}

Pose: ${pose}
Expression: ${expression}
Composition: ${composition}
Background: ${background}${styleLine}

Quality: high resolution, natural studio lighting, photorealistic, clean and minimal catalog style, age-appropriate and child-safe content.${safeMode}`
      );
    };

    /* ─── CSV BUILDER ─────────────────────────────────────────────────────────── */

    const buildCSV = (history) => {
      const headers = ['생성시간','세트명','성별','나이','체형','포즈','표정','구도','배경','의류설명','생성프롬프트'];
      const esc = v => `"${String(v).replace(/"/g, '""')}"`;
      const rows = history.map(h => {
        const m = h.meta;
        const clothingSummary = m.clothingItems.map((c, i) =>
          `[의류${i+1}] ${[c.color, c.material, c.fit].filter(Boolean).join('/')}`
        ).join(' | ');
        return [
          h.timestamp,
          m.label,
          m.gender === 'female' ? '여아' : '남아',
          m.age,
          getLabelKo(BODY_TYPE_OPTIONS, m.bodyType),
          m.pose       === 'custom' ? m.poseCustom        : getLabelKo(POSE_OPTIONS,        m.pose),
          m.expression === 'custom' ? m.expressionCustom  : getLabelKo(EXPRESSION_OPTIONS,  m.expression),
          m.composition=== 'custom' ? m.compositionCustom : getLabelKo(COMPOSITION_OPTIONS, m.composition),
          m.background === 'custom' ? m.bgCustom          : getLabelKo(BACKGROUND_OPTIONS,  m.background),
          clothingSummary,
          h.prompt,
        ].map(esc).join(',');
      });
      return [headers.join(','), ...rows].join('\r\n');
    };

    /* ─── BASE COMPONENTS ────────────────────────────────────────────────────── */

    function Accordion({ title, isOpen, onToggle, children }) {
      return (
        <div className="border border-gray-200 rounded-xl mb-3 overflow-hidden">
          <button
            type="button"
            onClick={onToggle}
            className="w-full flex items-center justify-between px-5 py-3.5 bg-white hover:bg-gray-50 transition-colors text-left focus:outline-none"
          >
            <span className="text-sm font-semibold text-gray-700">{title}</span>
            <svg
              className={`w-4 h-4 text-gray-400 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}
              fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"
            >
              <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
          {isOpen && (
            <div className="px-5 pb-5 pt-3 bg-white border-t border-gray-100 slide-in">
              {children}
            </div>
          )}
        </div>
      );
    }

    function PillRadio({ options, value, onChange, name }) {
      return (
        <div className="flex flex-wrap gap-2">
          {options.map(opt => (
            <label
              key={opt.value}
              className={`cursor-pointer select-none px-4 py-2 rounded-full border text-sm font-medium transition-all ${
                value === opt.value
                  ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                  : 'bg-white text-gray-600 border-gray-200 hover:border-blue-300 hover:text-blue-600'
              }`}
            >
              <input
                type="radio" name={name} value={opt.value}
                checked={value === opt.value} onChange={() => onChange(opt.value)}
                className="sr-only"
              />
              {opt.label}
            </label>
          ))}
        </div>
      );
    }

    function CustomInput({ placeholder, value, onChange }) {
      return (
        <input
          type="text" placeholder={placeholder} value={value}
          onChange={e => onChange(e.target.value)}
          className="mt-3 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-transparent"
        />
      );
    }

    function ImgUploader({ images, onAdd, onRemove, maxN, label }) {
      const ref = useRef(null);

      const handle = async (files) => {
        const slots = maxN - images.length;
        if (slots <= 0) return;
        const b64s = await Promise.all([...files].slice(0, slots).map(toBase64));
        onAdd(b64s);
      };

      return (
        <div>
          <div
            onDrop={e => { e.preventDefault(); handle(e.dataTransfer.files); }}
            onDragOver={e => e.preventDefault()}
            onClick={() => images.length < maxN && ref.current?.click()}
            className={`border-2 border-dashed rounded-xl p-4 text-center transition-all ${
              images.length >= maxN
                ? 'border-gray-200 bg-gray-50 cursor-not-allowed opacity-60'
                : 'border-blue-200 bg-blue-50 cursor-pointer hover:border-blue-400 hover:bg-blue-100'
            }`}
          >
            <svg className="w-6 h-6 mx-auto mb-1 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <p className="text-xs text-gray-500">
              {images.length >= maxN
                ? `최대 ${maxN}장 완료`
                : `${label} (${images.length}/${maxN}) — 클릭 또는 드래그`}
            </p>
            <input ref={ref} type="file" accept="image/*" multiple className="hidden"
              onChange={e => handle(e.target.files)} />
          </div>
          {images.length > 0 && (
            <div className="flex flex-wrap gap-2 mt-2">
              {images.map((src, i) => (
                <div key={i} className="relative group">
                  <img src={src} alt="" className="w-20 h-20 object-cover rounded-lg border border-gray-200 shadow-sm" />
                  <button
                    type="button"
                    onClick={() => onRemove(i)}
                    className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center shadow opacity-0 group-hover:opacity-100 transition-opacity"
                  >×</button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ─── SECTION COMPONENTS ─────────────────────────────────────────────────── */

    function ModelSection({ set, up }) {
      return (
        <div className="space-y-4">
          <ImgUploader
            images={set.modelImages}
            onAdd={imgs => up(s => ({ ...s, modelImages: [...s.modelImages, ...imgs].slice(0, 3) }))}
            onRemove={i => up(s => ({ ...s, modelImages: s.modelImages.filter((_, j) => j !== i) }))}
            maxN={3} label="모델 레퍼런스 이미지"
          />
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1.5">성별</label>
              <select
                value={set.gender}
                onChange={e => up(s => ({ ...s, gender: e.target.value }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
              >
                <option value="female">여아</option>
                <option value="male">남아</option>
              </select>
            </div>
            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1.5">나이 (4–15세)</label>
              <input
                type="number" min="4" max="15" value={set.age}
                onChange={e => up(s => ({ ...s, age: Math.max(4, Math.min(15, +e.target.value || 4)) }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
              />
            </div>
            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1.5">체형</label>
              <select
                value={set.bodyType}
                onChange={e => up(s => ({ ...s, bodyType: e.target.value }))}
                className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
              >
                {BODY_TYPE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
            </div>
          </div>
          {set.gender === 'female' && (
            <p className="text-xs text-purple-600 bg-purple-50 border border-purple-200 rounded-lg px-3 py-2">
              여아 선택 시 생성 프롬프트에 GPT Image2 safe mode template이 자동 적용됩니다.
            </p>
          )}
        </div>
      );
    }

    function PoseSection({ set, up }) {
      return (
        <div>
          <PillRadio name={`pose-${set.id}`} options={POSE_OPTIONS} value={set.pose}
            onChange={v => up(s => ({ ...s, pose: v }))} />
          {set.pose === 'custom' && (
            <CustomInput
              placeholder="포즈 직접 입력 (영문 권장 — e.g. sitting cross-legged on the floor)"
              value={set.poseCustom} onChange={v => up(s => ({ ...s, poseCustom: v }))}
            />
          )}
        </div>
      );
    }

    function ExpressionSection({ set, up }) {
      return (
        <div>
          <PillRadio name={`expr-${set.id}`} options={EXPRESSION_OPTIONS} value={set.expression}
            onChange={v => up(s => ({ ...s, expression: v }))} />
          {set.expression === 'custom' && (
            <CustomInput
              placeholder="표정 직접 입력 (영문 권장)"
              value={set.expressionCustom} onChange={v => up(s => ({ ...s, expressionCustom: v }))}
            />
          )}
        </div>
      );
    }

    function CompositionSection({ set, up }) {
      return (
        <div>
          <PillRadio name={`comp-${set.id}`} options={COMPOSITION_OPTIONS} value={set.composition}
            onChange={v => up(s => ({ ...s, composition: v }))} />
          {set.composition === 'custom' && (
            <CustomInput
              placeholder="구도 직접 입력 (영문 권장)"
              value={set.compositionCustom} onChange={v => up(s => ({ ...s, compositionCustom: v }))}
            />
          )}
        </div>
      );
    }

    function BackgroundSection({ set, up }) {
      return (
        <div className="space-y-4">
          <PillRadio name={`bg-${set.id}`} options={BACKGROUND_OPTIONS} value={set.background}
            onChange={v => up(s => ({ ...s, background: v }))} />
          {set.background === 'custom' && (
            <CustomInput
              placeholder="배경 직접 입력 (영문 권장 — e.g. soft pastel pink solid background)"
              value={set.bgCustom} onChange={v => up(s => ({ ...s, bgCustom: v }))}
            />
          )}
          <div>
            <p className="text-xs font-medium text-gray-600 mb-2">
              배경 레퍼런스 이미지 <span className="text-gray-400 font-normal">(선택)</span>
            </p>
            {set.bgImage ? (
              <div className="relative inline-block group">
                <img src={set.bgImage} alt="bg-ref" className="w-32 h-20 object-cover rounded-lg border border-gray-200 shadow-sm" />
                <button type="button" onClick={() => up(s => ({ ...s, bgImage: null }))}
                  className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center shadow">
                  ×
                </button>
              </div>
            ) : (
              <label className="inline-flex items-center gap-2 border-2 border-dashed border-blue-200 bg-blue-50 hover:border-blue-400 hover:bg-blue-100 transition-all rounded-xl px-4 py-2.5 text-sm text-gray-500 cursor-pointer">
                <svg className="w-4 h-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
                </svg>
                이미지 업로드
                <input type="file" accept="image/*" className="hidden"
                  onChange={async e => {
                    if (e.target.files[0]) {
                      const b = await toBase64(e.target.files[0]);
                      up(s => ({ ...s, bgImage: b }));
                    }
                  }} />
              </label>
            )}
          </div>
        </div>
      );
    }

    function ClothingCard({ item, index, total, onChange, onRemove }) {
      const fields = [
        { key: 'material', label: '소재',   ph: '예: 100% 면, 폴리에스터 혼방' },
        { key: 'color',    label: '색상',   ph: '예: 네이비, 오프화이트' },
        { key: 'fit',      label: '핏',     ph: '예: 오버핏, 레귤러핏' },
        { key: 'neckline', label: '넥라인', ph: '예: 라운드넥, V넥' },
      ];
      return (
        <div className="border border-gray-200 rounded-xl overflow-hidden">
          <div className="flex items-center justify-between px-4 py-2.5 bg-gray-50 border-b border-gray-200">
            <span className="text-sm font-semibold text-gray-700">의류 {index + 1}</span>
            {total > 1 && (
              <button type="button" onClick={onRemove}
                className="text-xs text-red-400 hover:text-red-600 transition-colors">삭제</button>
            )}
          </div>
          <div className="p-4 space-y-3">
            <ImgUploader
              images={item.images}
              onAdd={imgs => onChange({ ...item, images: [...item.images, ...imgs].slice(0, 5) })}
              onRemove={i => onChange({ ...item, images: item.images.filter((_, j) => j !== i) })}
              maxN={5} label="의류 이미지"
            />
            <div className="grid grid-cols-2 gap-2">
              {fields.map(({ key, label, ph }) => (
                <div key={key}>
                  <label className="block text-xs font-medium text-gray-600 mb-1">{label}</label>
                  <input
                    type="text" placeholder={ph} value={item[key]}
                    onChange={e => onChange({ ...item, [key]: e.target.value })}
                    className="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                  />
                </div>
              ))}
            </div>
            <div>
              <label className="block text-xs font-medium text-gray-600 mb-1">그래픽 · 프린트</label>
              <input
                type="text" placeholder="예: 스트라이프 패턴, 캐릭터 자수, 없음"
                value={item.graphic} onChange={e => onChange({ ...item, graphic: e.target.value })}
                className="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
              />
            </div>
          </div>
        </div>
      );
    }

    function ClothingSection({ set, up }) {
      const updateItem = (id, updated) =>
        up(s => ({ ...s, clothingItems: s.clothingItems.map(c => c.id === id ? updated : c) }));
      const removeItem = (id) =>
        up(s => ({ ...s, clothingItems: s.clothingItems.filter(c => c.id !== id) }));
      const addItem = () => {
        if (set.clothingItems.length < 5)
          up(s => ({ ...s, clothingItems: [...s.clothingItems, newClothingItem()] }));
      };
      return (
        <div className="space-y-3">
          {set.clothingItems.map((item, i) => (
            <ClothingCard
              key={item.id} item={item} index={i} total={set.clothingItems.length}
              onChange={u => updateItem(item.id, u)}
              onRemove={() => removeItem(item.id)}
            />
          ))}
          {set.clothingItems.length < 5 && (
            <button type="button" onClick={addItem}
              className="w-full border-2 border-dashed border-gray-200 rounded-xl py-3 text-sm text-gray-400 hover:border-blue-300 hover:text-blue-500 transition-colors">
              + 의류 추가
            </button>
          )}
        </div>
      );
    }

    function StyleSection({ set, up }) {
      return (
        <div className="space-y-3">
          <ImgUploader
            images={set.styleImages}
            onAdd={imgs => up(s => ({ ...s, styleImages: [...s.styleImages, ...imgs].slice(0, 5) }))}
            onRemove={i => up(s => ({ ...s, styleImages: s.styleImages.filter((_, j) => j !== i) }))}
            maxN={5} label="스타일 레퍼런스 이미지"
          />
          <textarea
            placeholder="스타일 메모 (예: 레트로 감성, 파스텔 톤 위주, 스포티한 느낌)"
            value={set.styleMemo} onChange={e => up(s => ({ ...s, styleMemo: e.target.value }))}
            rows={3}
            className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-300"
          />
        </div>
      );
    }

    /* ─── SET CARD ───────────────────────────────────────────────────────────── */

    function SetCard({ set, index, up, onRemove, canRemove }) {
      const tog = k => up(s => ({ ...s, open: { ...s.open, [k]: !s.open[k] } }));
      const sections = [
        { k: 'model',       title: '1. 모델 정보',            el: <ModelSection       set={set} up={up} /> },
        { k: 'pose',        title: '2. 포즈',                  el: <PoseSection        set={set} up={up} /> },
        { k: 'expression',  title: '3. 표정',                  el: <ExpressionSection  set={set} up={up} /> },
        { k: 'composition', title: '4. 구도 / 카메라 앵글',    el: <CompositionSection set={set} up={up} /> },
        { k: 'background',  title: '5. 배경',                  el: <BackgroundSection  set={set} up={up} /> },
        { k: 'clothing',    title: '6. 의류 정보',             el: <ClothingSection    set={set} up={up} /> },
        { k: 'style',       title: '7. 스타일 레퍼런스 (선택)', el: <StyleSection       set={set} up={up} /> },
      ];
      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 mb-5 overflow-hidden">
          {/* Card Header */}
          <div className="flex items-center gap-3 px-6 py-4 bg-gradient-to-r from-blue-600 to-indigo-600">
            <span className="w-7 h-7 bg-white bg-opacity-25 text-white rounded-full flex items-center justify-center text-sm font-bold shrink-0">
              {index + 1}
            </span>
            <input
              type="text" value={set.label}
              onChange={e => up(s => ({ ...s, label: e.target.value }))}
              className="flex-1 bg-transparent text-white font-semibold text-sm border-0 border-b border-transparent hover:border-white/40 focus:border-white focus:outline-none"
            />
            {canRemove && (
              <button type="button" onClick={onRemove}
                className="text-white/70 hover:text-white text-sm transition-colors shrink-0">
                세트 삭제
              </button>
            )}
          </div>
          {/* Accordion Sections */}
          <div className="p-5">
            {sections.map(({ k, title, el }) => (
              <Accordion key={k} title={title} isOpen={set.open[k]} onToggle={() => tog(k)}>
                {el}
              </Accordion>
            ))}
          </div>
        </div>
      );
    }

    /* ─── PROMPT RESULT CARD ──────────────────────────────────────────────────── */

    function PromptResult({ item }) {
      const [copied, setCopied] = useState(false);

      const copy = () => {
        const text = item.prompt;
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text)
            .then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); })
            .catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      };

      const fallbackCopy = (text) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        try { document.execCommand('copy'); } catch {}
        document.body.removeChild(ta);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const m = item.meta;
      const genderLabel = m.gender === 'female' ? '여아' : '남아';
      const poseLabel   = m.pose       === 'custom' ? m.poseCustom        : getLabelKo(POSE_OPTIONS,        m.pose);
      const bgLabel     = m.background === 'custom' ? m.bgCustom          : getLabelKo(BACKGROUND_OPTIONS,  m.background);
      const compLabel   = m.composition=== 'custom' ? m.compositionCustom : getLabelKo(COMPOSITION_OPTIONS, m.composition);

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 mb-4 fade-in">
          <div className="flex items-start justify-between gap-3 flex-wrap mb-3">
            <div>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-bold text-gray-800">{m.label}</span>
                <span className="text-xs text-gray-400">{item.timestamp}</span>
              </div>
              <div className="flex flex-wrap gap-1.5 mt-2">
                <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">
                  {genderLabel} {m.age}세
                </span>
                <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">
                  {getLabelKo(BODY_TYPE_OPTIONS, m.bodyType)}
                </span>
                <span className="text-xs bg-violet-100 text-violet-700 px-2 py-0.5 rounded-full">
                  {poseLabel}
                </span>
                <span className="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">
                  {compLabel}
                </span>
                <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">
                  {bgLabel}
                </span>
              </div>
            </div>
            <button
              onClick={copy}
              className={`shrink-0 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${
                copied
                  ? 'bg-green-100 text-green-700 border border-green-200'
                  : 'bg-blue-600 text-white hover:bg-blue-700 shadow-sm'
              }`}
            >
              {copied ? '✓ 복사됨' : '복사하기'}
            </button>
          </div>
          <pre className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm text-slate-700 font-mono leading-6 overflow-x-auto">
            {item.prompt}
          </pre>
        </div>
      );
    }

    /* ─── HISTORY SECTION ────────────────────────────────────────────────────── */

    function HistorySection({ history, onClear }) {
      if (!history.length) return null;

      const download = () => {
        const csv  = buildCSV(history);
        const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = `fashion_prompts_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      return (
        <section id="history-section" className="mt-10">
          <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
            <h2 className="text-base font-bold text-gray-800">
              생성 히스토리
              <span className="ml-2 text-sm font-normal text-gray-400">{history.length}개</span>
            </h2>
            <div className="flex gap-2">
              <button
                onClick={download}
                className="flex items-center gap-1.5 px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700 transition-colors shadow-sm"
              >
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                CSV 다운로드
              </button>
              <button
                onClick={onClear}
                className="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors"
              >
                초기화
              </button>
            </div>
          </div>
          {[...history].reverse().map(item => <PromptResult key={item.id} item={item} />)}
        </section>
      );
    }

    /* ─── APP ────────────────────────────────────────────────────────────────── */

    function App() {
      const [sets,    setSets]    = useState([newSet(1)]);
      const [history, setHistory] = useState([]);

      const upSet = useCallback((id, fn) =>
        setSets(prev => prev.map(s => s.id === id ? fn(s) : s)), []);

      const addSet    = () => setSets(prev => [...prev, newSet(prev.length + 1)]);
      const removeSet = (id) => setSets(prev => prev.filter(s => s.id !== id));

      const generate = () => {
        const now = new Date();
        const ts  = `${now.toLocaleDateString('ko-KR')} ${now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}`;

        const items = sets.map(set => ({
          id: uid(),
          timestamp: ts,
          meta: {
            ...set,
            modelImages: [],
            bgImage: null,
            styleImages: [],
            clothingItems: set.clothingItems.map(c => ({ ...c, images: [] })),
          },
          prompt: buildPrompt(set),
        }));

        setHistory(prev => [...prev, ...items]);
        setTimeout(() => {
          document.getElementById('history-section')?.scrollIntoView({ behavior: 'smooth' });
        }, 150);
      };

      return (
        <div className="min-h-screen bg-slate-50">
          {/* ── Header ── */}
          <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-20">
            <div className="max-w-3xl mx-auto px-4 py-4">
              <h1 className="text-lg font-bold text-gray-900">아동 패션 카탈로그 프롬프트 생성기</h1>
              <p className="text-xs text-gray-400 mt-0.5">AI 이미지 생성 도구용 프롬프트 자동 생성 — 클라이언트 전용, 이미지 외부 전송 없음</p>
            </div>
          </header>

          <main className="max-w-3xl mx-auto px-4 py-6">
            {/* ── Notice Banner ── */}
            <div className="flex items-start gap-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 mb-6">
              <svg className="w-4 h-4 mt-0.5 shrink-0 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <p className="text-sm text-amber-800">
                생성된 프롬프트는 <strong>GPT-Image, Midjourney</strong> 등 외부 AI 이미지 생성 도구에서 사용하세요.
                업로드한 이미지는 브라우저 내에서만 처리되며 외부로 전송되지 않습니다.
              </p>
            </div>

            {/* ── Sets ── */}
            {sets.map((set, i) => (
              <SetCard
                key={set.id}
                set={set}
                index={i}
                up={fn => upSet(set.id, fn)}
                onRemove={() => removeSet(set.id)}
                canRemove={sets.length > 1}
              />
            ))}

            {/* ── Add Set ── */}
            <button
              type="button"
              onClick={addSet}
              className="w-full mb-5 border-2 border-dashed border-blue-200 rounded-2xl py-4 text-blue-500 font-medium text-sm hover:border-blue-400 hover:bg-blue-50 transition-all flex items-center justify-center gap-2"
            >
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
              </svg>
              세트 추가 (배치 모드)
            </button>

            {/* ── Generate ── */}
            <button
              type="button"
              onClick={generate}
              className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-4 rounded-2xl text-base shadow-lg hover:shadow-xl transition-all active:scale-[0.99]"
            >
              프롬프트 생성
              {sets.length > 1 && (
                <span className="ml-2 text-blue-200 font-normal text-sm">({sets.length}개 세트)</span>
              )}
            </button>

            {/* ── History ── */}
            <HistorySection history={history} onClear={() => setHistory([])} />
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
